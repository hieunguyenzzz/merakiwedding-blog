user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log notice;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    keepalive_timeout  65;
    
    # Enable gzip compression
    gzip  on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_vary on;
    gzip_types
      application/atom+xml
      application/javascript
      application/json
      application/ld+json
      application/manifest+json
      application/rss+xml
      application/vnd.geo+json
      application/vnd.ms-fontobject
      application/x-font-ttf
      application/x-web-app-manifest+json
      application/xhtml+xml
      application/xml
      font/opentype
      image/bmp
      image/svg+xml
      image/x-icon
      text/cache-manifest
      text/css
      text/plain
      text/vcard
      text/vnd.rim.location.xloc
      text/vtt
      text/x-component
      text/x-cross-domain-policy;

    # Setup cache
    proxy_cache_path /tmp/nginx levels=1:2 keys_zone=images_cache:10m max_size=10g inactive=60d;
    proxy_cache_valid 200 5760m;
    proxy_cache_valid 404 301 302 5m;
    proxy_cache_key "$host$request_uri";

    # Upstream definitions
    upstream merakiweddingplannertunnel {
      server 172.22.0.4:80;
    }

    upstream merakinextjstunnel {
      server nextjs:3000;
    }

    upstream merakinetlify {
      server merakiweddingplanner.netlify.app;
    }

    # Server configuration
    server {
        server_name merakiweddingplanner.com;
        
        location = /graphql {
            proxy_set_header  X-Real-IP  $remote_addr;
            proxy_set_header  X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Host $http_host;
            proxy_redirect off;
            
            proxy_pass http://merakiweddingplannertunnel;
        }
        
        location ~ \.php$ {
            proxy_set_header  X-Real-IP  $remote_addr;
            proxy_set_header  X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Host $http_host;
            proxy_redirect off;
            
            proxy_pass http://merakiweddingplannertunnel;
        }
        
        location = /wp-content {
            return 200 "test";
        }
        
        location /symless {
            return 200 "7B76313B62617369633B68696575206E677579656E3B313B7468657468692E74686963687468617440676D61696C2E636F6D3B203B303B307D";
        }
        
        location ~ ^(/wp\-) {
            proxy_set_header  X-Real-IP  $remote_addr;
            proxy_set_header  X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Host $http_host;
            proxy_redirect off;
            
            proxy_pass http://merakiweddingplannertunnel;
        }
        
        location /about-us {
            return 301 $scheme://merakiweddingplanner.com/about;
        }
        
        location /traditional-wedding-playbook {
            return 301 $scheme://merakiweddingplanner.com/posts/traditional-wedding-playbook;
        }
        
        location /tiec-doc-than {
            return 301 $scheme://merakiweddingplanner.com/posts/tiec-doc-than-vi;
        }
        
        location /after-party {
            return 301 $scheme://merakiweddingplanner.com/posts/after-party;
        }
        
        location /unique-locations {
            return 301 $scheme://merakiweddingplanner.com/posts/unique-locations;
        }
        
        location = /posts/kinh-nghiem-to-chuc-tiec-cuoi-tai-dao-ngoc-phu-quoc {
            return 301 https://merakiweddingplanner.com/posts/kinh-nghiem-to-chuc-tiec-cuoi-tai-dao-ngoc-phu-quoc-vi;
        }
        
        location = /how-to-plan-a-wedding-after-party {
            return 301 https://merakiweddingplanner.com/posts/how-to-plan-a-wedding-after-party;
        }
        
        location /api/contact {
            proxy_pass http://merakinextjstunnel;
        }
        
        location /_next/image {
            proxy_buffering        on;
            proxy_cache            images_cache;
            proxy_cache_valid      200  1d;
            proxy_pass http://merakinextjstunnel;
        }
        
        location ~* \.(pdf)$ {
            root /var/www/hieunguyen/data/www/merakiweddingplanner.com;
        }
        
        location / {
            if ($arg_p) {
                proxy_pass http://merakiweddingplannertunnel;
            }
            
            if ($arg_preview) {
                proxy_pass http://merakiweddingplannertunnel;
            }
            
            if ($arg_wordfence_syncAttackData) {
                proxy_pass http://merakiweddingplannertunnel;
            }
            
            proxy_pass http://merakinextjstunnel;
        }
        
        error_log /var/log/nginx/merakiweddingplanner.error.log;
        access_log /var/log/nginx/merakiweddingplanner.access.log;
        
        listen 80;
    }
} 